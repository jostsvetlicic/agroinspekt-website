# Netlify build configuration for this Next.js App Router site.
# Without the official Next.js runtime plugin, Netlify treats the repo as a
# static site and publishes the raw source files (no SSR, no middleware, no
# dynamic /[locale] routes) - which is why every URL returned "Page not found".
# The plugin builds the app and wires up middleware + server routes.

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  # Next.js 15 requires a modern Node runtime.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
